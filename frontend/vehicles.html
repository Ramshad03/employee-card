<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vehicles</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">🏢 Carbon (logo) </div>
    <ul class="nav-links">
      <li class="nav-tab-group">
        <a href="employees.html">Employees</a>
        <span class="nav-separator">|</span>
        <a href="vehicles.html" class="active">Vehicle</a>
      </li>
      <li id="notifWrapper">
        <button class="notif-btn" onclick="toggleNotifPanel()" title="Notifications">
          🔔
          <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
        </button>
        <div class="notif-panel" id="notifPanel">
          <div class="notif-header">Notifications</div>
          <div class="notif-list" id="notifList">
            <div class="notif-empty">Loading...</div>
          </div>
        </div>
      </li>
      <li><button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button></li>
    </ul>
  </nav>

  <div class="page-header">
    <h2>Vehicle Directory</h2>
    <div class="header-actions">
      <div class="search-filter-wrap">
        <input type="text" id="searchInput" placeholder="Search vehicles..." />
        <button type="button" class="search-filter-btn" id="vehicleFilterToggle" title="Filter vehicles">Filter</button>
        <div class="search-filter-menu vehicle-filter-menu" id="vehicleFilterMenu">
          <button type="button" class="active" data-filter="all"><span class="filter-dot all"></span>All vehicles</button>
          <button type="button" data-filter="active"><span class="filter-dot green"></span>Active</button>
          <button type="button" data-filter="in-service"><span class="filter-dot blue"></span>In Service</button>
          <button type="button" data-filter="maintenance"><span class="filter-dot orange"></span>Under Maintenance</button>
          <button type="button" data-filter="inactive"><span class="filter-dot red"></span>Inactive</button>
          <button type="button" data-filter="mulkiya-expired"><span class="filter-dot red"></span>Mulkiya Expired</button>
          <button type="button" data-filter="insurance-expired"><span class="filter-dot red"></span>Insurance Expired</button>
          <button type="button" data-filter="documents-expiring"><span class="filter-dot orange"></span>Documents Expiring</button>
          <button type="button" data-filter="documents-due"><span class="filter-dot yellow"></span>Documents Due Soon</button>
        </div>
      </div>
      <button class="btn-primary" onclick="openAddVehicleModal()">+ Add Vehicle</button>
      <button class="btn-secondary" onclick="exportVehicleCSV()">📥 Export CSV</button>
    </div>
  </div>

  <div class="employee-grid" id="vehicleGrid"></div>

  <!-- Add/Edit Vehicle Modal -->
  <div class="modal-overlay" id="vehicleModalOverlay">
    <div class="modal">
      <h3 id="vehicleModalTitle">Add Vehicle</h3>
      <form id="vehicleForm">
        <input type="hidden" id="vehicleId" />

        <div class="form-group">
          <label>Vehicle ID</label>
          <input type="text" id="vehVehicleId" placeholder="e.g. VH001" required />
        </div>
        <div class="form-group">
          <label>Vehicle Name / Model</label>
          <input type="text" id="vehName" placeholder="e.g. Toyota Hilux" required />
        </div>
        <div class="form-group">
          <label>License Plate</label>
          <input type="text" id="vehPlate" placeholder="e.g. A 12345" />
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="vehType">
            <option value="">Select type</option>
            <option value="Car">Car</option>
            <option value="Truck">Truck</option>
            <option value="Van">Van</option>
            <option value="Bus">Bus</option>
            <option value="Motorcycle">Motorcycle</option>
            <option value="Other">Other</option>
          </select>
        <div class="form-group">
          <label>Assign Driver</label>
          <select id="vehDriver">
            <option value="">Select employee...</option>
          </select>
        </div>
        <div class="form-group">
          <label>Registration Date</label>
          <input type="date" id="vehRegDate" />
        </div>
        <div class="form-group">
          <label>Insurance Provider</label>
          <input type="text" id="vehInsuranceProvider" placeholder="e.g. Oman Insurance" />
        </div>
        <div class="form-group">
          <label>Policy Number</label>
          <input type="text" id="vehPolicyNumber" placeholder="Enter policy number" />
        </div>
        <div class="form-group">
          <label>Insurance Start Date</label>
          <input type="date" id="vehInsuranceStartDate" />
        </div>
        <div class="form-group">
          <label>Insurance Expiry</label>
          <input type="date" id="vehInsuranceExpiry" />
        </div>
        <div class="form-group">
          <label>Insurance Document (PDF/Image)</label>
          <input type="file" id="vehInsuranceDoc" accept="image/*,.pdf" />
        </div>
        <div class="form-group">
          <label>Mulkiya Number</label>
          <input type="text" id="vehMulkiyaNumber" placeholder="Enter Mulkiya number" />
        </div>
        <div class="form-group">
          <label>Mulkiya Issue Date</label>
          <input type="date" id="vehMulkiyaIssueDate" />
        </div>
        <div class="form-group">
          <label>Mulkiya Expiry Date</label>
          <input type="date" id="vehMulkiyaExpiryDate" />
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="vehStatus">
            <option value="Active">Active</option>
            <option value="In Service">In Service</option>
            <option value="Under Maintenance">Under Maintenance</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
        <div class="form-group">
          <label>Photo</label>
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <input type="file" id="vehPhoto" accept="image/*" />
          </div>
          <div id="vehCropContainer" style="display:none; margin-top:10px;">
            <img id="vehCropImage" style="max-width:100%; display:block;" />
            <button type="button" class="btn-primary" id="vehCropBtn" style="margin-top:10px;">✂️ Crop & Use Photo</button>
          </div>
          <img id="vehCroppedPreview" style="display:none; width:120px; height:80px; border-radius:8px; object-fit:cover; border:3px solid #e94560; margin-top:10px;" />
        </div>

        <div id="vehCustomFieldsContainer"></div>

        <div class="modal-actions">
          <button type="button" class="btn-add-field" onclick="addVehicleCustomField()">+ Add Field</button>
          <button type="submit" class="btn-primary" id="vehSaveBtn">Save</button>
          <button type="button" class="btn-secondary" onclick="closeVehicleModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 Carbon. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>
  <script src="vehicle-app.js"></script>
  <script src="notifications.js"></script>
  <script>
    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark-theme');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('themeBtn').textContent = isDark ? '☀️ Light' : '🌙 Dark';
    }
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        document.body.classList.add('dark-theme');
        document.addEventListener('DOMContentLoaded', () => {
          const btn = document.getElementById('themeBtn');
          if (btn) btn.textContent = '☀️ Light';
        });
      }
    })();
  </script>
</body>
</html>
