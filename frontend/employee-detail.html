<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employee Details</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">🏢 Carbon (logo) </div>
    <ul class="nav-links">
      <li class="nav-tab-group">
        <a href="employees.html">Employees</a>
        <span class="nav-separator">|</span>
        <a href="vehicles.html">Vehicle</a>
      </li>
      <li id="notifWrapper">
        <button class="notif-btn" onclick="toggleNotifPanel()" title="Notifications">
          🔔
          <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
        </button>
        <div class="notif-panel" id="notifPanel">
          <div class="notif-header">Notifications</div>
          <div class="notif-list" id="notifList">
            <div class="notif-empty">Loading...</div>
          </div>
        </div>
      </li>
      <li><button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button></li>
    </ul>
  </nav>

  <div class="detail-container" id="detailContainer">
    <p style="color:#888; padding:40px; text-align:center;">Loading...</p>
  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>Edit Employee</h3>
      <form id="employeeForm">
        <input type="hidden" id="employeeId" />
        <input type="hidden" id="existingVisaDoc" />
        <div class="form-group">
          <label>Employee ID</label>
          <input type="text" id="empEmployeeId" placeholder="Enter employee ID" required />
        </div>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="empName" placeholder="Enter full name" required />
        </div>
        <div class="form-group">
          <label>Role</label>
          <input type="text" id="empRole" placeholder="Enter role" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="empEmail" placeholder="Enter email" />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" id="empPhone" placeholder="Enter phone number" />
        </div>
        <div class="form-group">
          <label>Department</label>
          <input type="text" id="empDepartment" placeholder="Enter department" />
        </div>
        <div class="form-group">
          <label>Join Date</label>
          <input type="date" id="empJoinDate" />
        </div>
        <div class="form-group">
          <label>Annual Leave Days</label>
          <input type="number" id="empLeaveDays" placeholder="e.g. 60" min="1" required />
        </div>
        <div class="form-group">
          <label>Grant Leave From</label>
          <input type="date" id="empLeaveGrantedDate" />
        </div>
        <div class="form-group">
          <label>Extend Leave Until</label>
          <input type="date" id="empExtendLeaveUntil" />
        </div>
        <div class="form-group">
          <label>Visa Expiry</label>
          <input type="date" id="empVisaDate" />
        </div>
        <div class="form-group">
          <label>Visa Document (PDF/Image)</label>
          <input type="file" id="empVisaDoc" accept="image/*,.pdf" />
        </div>
        <div class="form-group">
          <label>Photo</label>
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <input type="file" id="empPhoto" accept="image/*" />
            <input type="file" id="empCamera" accept="image/*" capture="environment" style="display:none;" />
            <button type="button" class="btn-secondary" onclick="openWebcam()">📷 Camera</button>
          </div>
          <div id="cropContainer" style="display:none; margin-top:10px;">
            <img id="cropImage" style="max-width:100%; display:block;" />
            <button type="button" class="btn-primary" id="cropBtn" style="margin-top:10px;">✂️ Crop & Use Photo</button>
          </div>
          <canvas id="croppedCanvas" style="display:none;"></canvas>
          <img id="croppedPreview" style="display:none; width:90px; height:90px; border-radius:50%; object-fit:cover; border:3px solid #e94560; margin-top:10px;" />
        </div>

        <div id="customFieldsContainer"></div>

        <div class="modal-actions">
          <button type="button" class="btn-add-field" onclick="addCustomField()">+ Add Field</button>
          <button type="submit" class="btn-primary">Save</button>
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Webcam Modal -->
  <div id="webcamModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:300; justify-content:center; align-items:center;">
    <div style="background:#fff; border-radius:14px; padding:24px; width:420px; max-width:95%; text-align:center;">
      <h3 style="margin-bottom:16px; color:#1a1a2e;">Take Photo</h3>
      <video id="webcamVideo" autoplay playsinline style="width:100%; border-radius:8px; margin-bottom:12px;"></video>
      <canvas id="webcamCanvas" style="display:none;"></canvas>
      <div style="display:flex; gap:10px; justify-content:center; margin-top:8px;">
        <button type="button" class="btn-primary" id="webcamCaptureBtn">📸 Capture</button>
        <button type="button" class="btn-secondary" id="webcamCloseBtn">✕ Close</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 Carbon. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>
  <script src="notifications.js"></script>
  <script>
    const API = 'http://localhost:3000/api';
    let currentEmployee = null;
    let cropper = null;
    let croppedBlob = null;
    let webcamStream = null;

    const urlParams = new URLSearchParams(window.location.search);
    const empId = urlParams.get('id');

    // ===== STATUS COLOR =====
    function getStatusColor(emp) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      // Check if on leave → grey
      if (emp.leaveGrantedDate && emp.leaveGrantedDate !== 'null') {
        const grantedDate = new Date(emp.leaveGrantedDate);
        grantedDate.setHours(0, 0, 0, 0);
        let leaveEndDate;
        if (emp.extendLeaveUntil && emp.extendLeaveUntil !== 'null') {
          leaveEndDate = new Date(emp.extendLeaveUntil);
          leaveEndDate.setHours(0, 0, 0, 0);
          leaveEndDate.setDate(leaveEndDate.getDate() + 1);
        } else {
          leaveEndDate = new Date(grantedDate);
          leaveEndDate.setDate(leaveEndDate.getDate() + (emp.leaveDays || 0));
        }
        if (today >= grantedDate && today < leaveEndDate) return '#888888';
      }

      // Visa expiry logic
      if (!emp.visaDate) return '#27ae60';
      const expiry = new Date(emp.visaDate);
      expiry.setHours(0, 0, 0, 0);
      const daysLeft = Math.round((expiry - today) / (1000 * 60 * 60 * 24));

      if (daysLeft < 0)   return '#e94560';
      if (daysLeft <= 45) return '#e67e22';
      if (daysLeft <= 90) return '#f1c40f';
      return '#27ae60';
    }

    // ===== CALCULATE JOIN DURATION =====
    function calcJoinDuration(joinDate) {
      const start = new Date(joinDate);
      const today = new Date();

      let years = today.getFullYear() - start.getFullYear();
      let months = today.getMonth() - start.getMonth();
      let days = today.getDate() - start.getDate();

      if (days < 0) {
        months--;
        const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
        days += prevMonth.getDate();
      }
      if (months < 0) { years--; months += 12; }

      const weeks = Math.floor(days / 7);
      const remainingDays = days % 7;

      let parts = [];
      if (years > 0)         parts.push(`${years} year${years > 1 ? 's' : ''}`);
      if (months > 0)        parts.push(`${months} month${months > 1 ? 's' : ''}`);
      if (weeks > 0)         parts.push(`${weeks} week${weeks > 1 ? 's' : ''}`);
      if (remainingDays > 0) parts.push(`${remainingDays} day${remainingDays > 1 ? 's' : ''}`);

      return parts.length > 0 ? parts.join(' ') : 'Just joined today';
    }

    // ===== CALCULATE LEAVE DUE =====
    function calcLeaveDue(joinDate, leaveDays, leaveGrantedDate, extendLeaveUntil) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const join = new Date(joinDate);
      join.setHours(0, 0, 0, 0);

      const deadline = new Date(join);
      deadline.setDate(deadline.getDate() + 365);
      const daysRemaining = Math.round((deadline - today) / (1000 * 60 * 60 * 24));

      if (leaveGrantedDate && leaveGrantedDate !== 'null') {
        const grantedDate = new Date(leaveGrantedDate);
        grantedDate.setHours(0, 0, 0, 0);

        let leaveEndDate;
        if (extendLeaveUntil && extendLeaveUntil !== 'null') {
          leaveEndDate = new Date(extendLeaveUntil);
          leaveEndDate.setHours(0, 0, 0, 0);
          leaveEndDate.setDate(leaveEndDate.getDate() + 1);
        } else {
          leaveEndDate = new Date(grantedDate);
          leaveEndDate.setDate(leaveEndDate.getDate() + leaveDays);
        }

        const totalLeaveTaken = Math.round((leaveEndDate - grantedDate) / (1000 * 60 * 60 * 24));

        if (today >= grantedDate && today < leaveEndDate) {
          const daysIntoLeave = Math.round((today - grantedDate) / (1000 * 60 * 60 * 24));
          return { status: 'grey', displayDays: daysIntoLeave, mode: 'onleave', totalLeaveTaken };
        }

        if (today >= leaveEndDate) {
          const nextDeadline = new Date(leaveEndDate);
          nextDeadline.setDate(nextDeadline.getDate() + 365);
          const nextDays = Math.round((nextDeadline - today) / (1000 * 60 * 60 * 24));
          if (nextDays < 0) return { status: 'red', displayDays: nextDays, mode: 'overdue', totalLeaveTaken };
          return { status: 'green', displayDays: nextDays, mode: 'countdown', totalLeaveTaken };
        }

        if (daysRemaining < 0) return { status: 'red', displayDays: daysRemaining, mode: 'overdue', totalLeaveTaken };
        return { status: 'green', displayDays: daysRemaining, mode: 'countdown', totalLeaveTaken };
      }

      if (daysRemaining < 0) return { status: 'red', displayDays: daysRemaining, mode: 'overdue', totalLeaveTaken: 0 };
      return { status: 'green', displayDays: daysRemaining, mode: 'countdown', totalLeaveTaken: 0 };
    }

    // ===== LOAD EMPLOYEE =====
    async function loadEmployee() {
      const res = await fetch(`${API}/employees`);
      const employees = await res.json();
      currentEmployee = employees.find(e => e.id === empId);

      if (!currentEmployee) {
        document.getElementById('detailContainer').innerHTML =
          '<p style="color:#e94560; padding:40px; text-align:center;">Employee not found.</p>';
        return;
      }
      renderDetail(currentEmployee);
    }

    // ===== RENDER DETAIL PAGE =====
    async function renderDetail(emp) {
      const imgSrc = emp.photo
        ? emp.photo
        : 'https://ui-avatars.com/api/?name=' + encodeURIComponent(emp.name) + '&background=e94560&color=fff&size=200';

      const photoBorderColor = getStatusColor(emp);

      let joinDurationHTML = '';
      let leaveHTML = '';

      if (emp.joinDate) {
        const duration = calcJoinDuration(emp.joinDate);
        joinDurationHTML = `<p class="join-duration">📅 Number of days joined: ${duration}</p>`;

        if (emp.leaveDays) {
          const { status, displayDays, mode, totalLeaveTaken } = calcLeaveDue(emp.joinDate, emp.leaveDays, emp.leaveGrantedDate, emp.extendLeaveUntil);
          const isOverdue = status === 'red';

          let leaveLabel = '';
          if (mode === 'onleave') {
            leaveLabel = `On leave for ${displayDays} day${displayDays !== 1 ? 's' : ''}`;
          } else if (mode === 'overdue') {
            leaveLabel = `Leave due in ${displayDays} day${Math.abs(displayDays) !== 1 ? 's' : ''}`;
          } else {
            leaveLabel = `Leave due in ${displayDays} day${displayDays !== 1 ? 's' : ''}`;
          }

          const totalLeaveHTML = totalLeaveTaken > 0
            ? `<p class="total-leave-taken">Total leave taken: ${totalLeaveTaken} day${totalLeaveTaken !== 1 ? 's' : ''}</p>`
            : '';

          leaveHTML = `
            <div class="leave-status">
              <span class="status-dot ${status}"></span>
              <span class="leave-text ${isOverdue ? 'overdue' : ''}">${leaveLabel}</span>
            </div>
            ${totalLeaveHTML}`;
        }
      }

      let fieldsHTML = '';
      if (emp.department) fieldsHTML += detailRow('Department', emp.department);
      if (emp.email)      fieldsHTML += detailRow('Email', emp.email);
      if (emp.phone)      fieldsHTML += detailRow('Phone', emp.phone);
      if (emp.joinDate)   fieldsHTML += detailRow('Join Date', new Date(emp.joinDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }));

      // Visa Renewed dropdown
      fieldsHTML += `
        <div class="detail-row" style="cursor:pointer;" onclick="toggleVisaDoc()">
          <span class="detail-label" style="display:flex; align-items:center; gap:8px;">
            Visa Expiry
            <span id="visaArrow" style="width:22px; height:22px; border-radius:50%; border:1.5px solid #ccc; display:inline-flex; align-items:center; justify-content:center; font-size:10px; transition:transform 0.3s;">▼</span>
          </span>
          <span class="detail-value">${emp.visaDate ? new Date(emp.visaDate).toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'}) : '—'}</span>
        </div>
        <div id="visaDropdown" style="display:none; background:#f4f6f8; border-radius:10px; padding:14px 16px; margin:4px 0 8px 0;">
          ${emp.visaDoc ? `
            <p style="font-weight:600; color:#444; margin:0 0 8px 0; font-size:14px;">Document</p>
            ${emp.visaDoc.startsWith('data:image') ? `
              <img src="${emp.visaDoc}" onclick="openVisaDoc('${emp.visaDoc}', 'image')"
                style="width:100%; max-height:160px; object-fit:cover; border-radius:8px; cursor:pointer; border:1px solid #ddd;" />
            ` : `
              <div onclick="openVisaDoc('${emp.visaDoc}', 'pdf')"
                style="display:flex; align-items:center; gap:10px; padding:14px; background:#fff; border:1px solid #ddd; border-radius:8px; cursor:pointer;">
                <span style="font-size:28px;">📄</span>
                <span style="color:#2980b9; font-weight:600;">View Document</span>
              </div>
            `}
          ` : '<p style="color:#aaa; font-size:13px; margin:0;">No visa document uploaded yet.</p>'}
        </div>`;

      if (emp.leaveDays)  fieldsHTML += detailRow('Annual Leave', `${emp.leaveDays} days`);

      // Auto-detect assigned vehicle
      try {
        const vRes = await fetch('http://localhost:3000/api/vehicles');
        const vehicles = await vRes.json();
        const assignedVehicle = vehicles.find(v =>
          (v.driver || '').toLowerCase().trim() === (emp.name || '').toLowerCase().trim()
        );
        if (assignedVehicle) {
          fieldsHTML += `
            <div class="detail-row">
              <span class="detail-label">Assigned Vehicle</span>
              <span class="detail-value" style="display:flex; align-items:center; gap:8px;">
                <span> </span>
                <a href="vehicle-detail.html?id=${assignedVehicle.id}" style="color:#e94560; font-weight:600; text-decoration:none;">
                  ${assignedVehicle.name || ''} (${assignedVehicle.vehicleId || ''})
                </a>
              </span>
            </div>`;
        }
      } catch(err) {}

      if (emp.customFields && emp.customFields.length > 0) {
        emp.customFields.forEach(cf => {
          if (cf.label && cf.value) fieldsHTML += detailRow(cf.label, cf.value);
        });
      }

      document.getElementById('detailContainer').innerHTML = `
        <div class="detail-back">
          <a href="employees.html" class="btn-secondary">← Back to Employees</a>
        </div>
        <div class="detail-card">
          <div class="detail-photo-wrapper">
            <img src="${imgSrc}" alt="${emp.name}" class="detail-photo" style="border-color: ${photoBorderColor};" />
          </div>
          <div class="detail-info">
            <h2 class="detail-emp-id">${emp.employeeId || ''}</h2>
            <h3 class="detail-emp-name">${emp.name || ''}</h3>
            <p class="detail-role">${emp.role || ''}</p>

            ${(joinDurationHTML || leaveHTML) ? `
            <div class="join-info">
              ${joinDurationHTML}
              ${leaveHTML}
            </div>` : ''}

            <div class="detail-fields">
              ${fieldsHTML}
            </div>

            <div class="detail-actions">
              <button class="btn-primary" onclick="openEditModal()">Edit</button>
              <button class="btn-delete" onclick="deleteEmployee()">Delete</button>
            </div>
          </div>
        </div>
      `;
    }

    function detailRow(label, value) {
      return `
        <div class="detail-row">
          <span class="detail-label">${label}</span>
          <span class="detail-value">${value}</span>
        </div>`;
    }

    // ===== WEBCAM =====
    async function openWebcam() {
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (isMobile) {
        document.getElementById('empCamera').click();
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('Your browser does not support camera access. Please use Chrome or Edge.');
        return;
      }

      const modal = document.getElementById('webcamModal');
      if (!modal) {
        alert('Webcam modal not found.');
        return;
      }
      modal.style.display = 'flex';

      try {
        webcamStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }
        });
        document.getElementById('webcamVideo').srcObject = webcamStream;
      } catch (err) {
        modal.style.display = 'none';
        if (err.name === 'NotAllowedError') {
          alert('Camera access denied. Please click the 🔒 lock icon in the address bar and set Camera to Allow, then refresh.');
        } else if (err.name === 'NotFoundError') {
          alert('No camera found on this device.');
        } else {
          alert('Camera error: ' + err.message);
        }
      }
    }

    function closeWebcam() {
      document.getElementById('webcamModal').style.display = 'none';
      if (webcamStream) {
        webcamStream.getTracks().forEach(t => t.stop());
        webcamStream = null;
      }
    }

    // ===== EDIT MODAL =====
    function openEditModal() {
      const emp = currentEmployee;
      document.getElementById('employeeId').value = emp.id;
      document.getElementById('empEmployeeId').value = emp.employeeId || '';
      document.getElementById('empName').value = emp.name || '';
      document.getElementById('empRole').value = emp.role || '';
      document.getElementById('empEmail').value = emp.email || '';
      document.getElementById('empPhone').value = emp.phone || '';
      document.getElementById('empDepartment').value = emp.department || '';
      document.getElementById('empJoinDate').value = emp.joinDate || '';
      document.getElementById('empLeaveDays').value = emp.leaveDays || '';
      document.getElementById('empLeaveGrantedDate').value = emp.leaveGrantedDate || '';
      document.getElementById('empExtendLeaveUntil').value = emp.extendLeaveUntil || '';
      document.getElementById('existingVisaDoc').value = emp.visaDoc || '';
      document.getElementById('empVisaDate').value = emp.visaDate || '';
      document.getElementById('cropContainer').style.display = 'none';
      document.getElementById('croppedPreview').style.display = 'none';
      clearCustomFields();
      if (emp.customFields && emp.customFields.length > 0) {
        emp.customFields.forEach(cf => addCustomField(cf.label, cf.value));
      }
      croppedBlob = null;
      if (cropper) { cropper.destroy(); cropper = null; }
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      if (cropper) { cropper.destroy(); cropper = null; }
      croppedBlob = null;
      clearCustomFields();
    }

    // ===== CUSTOM FIELDS =====
    function addCustomField(label = '', value = '') {
      const container = document.getElementById('customFieldsContainer');
      const row = document.createElement('div');
      row.className = 'custom-field-row';
      row.innerHTML = `
        <input type="text" class="cf-label" placeholder="Field name (e.g. Blood Group)" value="${label}" />
        <input type="text" class="cf-value" placeholder="Value (e.g. A+)" value="${value}" />
        <button type="button" class="btn-remove-field" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(row);
    }

    function getCustomFields() {
      const rows = document.querySelectorAll('.custom-field-row');
      const fields = [];
      rows.forEach(row => {
        const label = row.querySelector('.cf-label').value.trim();
        const value = row.querySelector('.cf-value').value.trim();
        if (label && value) fields.push({ label, value });
      });
      return fields;
    }

    function clearCustomFields() {
      document.getElementById('customFieldsContainer').innerHTML = '';
    }

    // ===== CROPPER =====
    function initCropper() {
      function handlePhotoInput(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const cropImage = document.getElementById('cropImage');
          document.getElementById('cropContainer').style.display = 'block';
          document.getElementById('croppedPreview').style.display = 'none';
          cropImage.src = ev.target.result;
          setTimeout(() => {
            if (cropper) cropper.destroy();
            cropper = new Cropper(cropImage, {
              aspectRatio: 1, viewMode: 1,
              movable: true, zoomable: true,
              scalable: true, cropBoxResizable: true,
            });
          }, 200);
        };
        reader.readAsDataURL(file);
      }

      const empPhoto = document.getElementById('empPhoto');
      if (empPhoto) empPhoto.addEventListener('change', handlePhotoInput);

      const empCamera = document.getElementById('empCamera');
      if (empCamera) empCamera.addEventListener('change', handlePhotoInput);

      const webcamCloseBtn = document.getElementById('webcamCloseBtn');
      if (webcamCloseBtn) webcamCloseBtn.addEventListener('click', closeWebcam);

      const webcamCaptureBtn = document.getElementById('webcamCaptureBtn');
      if (webcamCaptureBtn) {
        webcamCaptureBtn.addEventListener('click', () => {
          const video = document.getElementById('webcamVideo');
          const canvas = document.getElementById('webcamCanvas');
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          canvas.getContext('2d').drawImage(video, 0, 0);
          canvas.toBlob((blob) => {
            closeWebcam();
            const url = URL.createObjectURL(blob);
            const cropImage = document.getElementById('cropImage');
            document.getElementById('cropContainer').style.display = 'block';
            document.getElementById('croppedPreview').style.display = 'none';
            cropImage.src = url;
            setTimeout(() => {
              if (cropper) cropper.destroy();
              cropper = new Cropper(cropImage, {
                aspectRatio: 1, viewMode: 1,
                movable: true, zoomable: true,
                scalable: true, cropBoxResizable: true,
              });
            }, 200);
          }, 'image/jpeg', 0.9);
        });
      }

      const cropBtn = document.getElementById('cropBtn');
      if (cropBtn) {
        cropBtn.addEventListener('click', () => {
          if (!cropper) return;
          const canvas = cropper.getCroppedCanvas({ width: 300, height: 300 });
          canvas.toBlob((blob) => {
            croppedBlob = blob;
            const preview = document.getElementById('croppedPreview');
            preview.src = URL.createObjectURL(blob);
            preview.style.display = 'block';
            document.getElementById('cropContainer').style.display = 'none';
            cropper.destroy();
            cropper = null;
          }, 'image/jpeg', 0.9);
        });
      }
    }

    // ===== BASE64 =====
    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function getPhotoBase64() {
      if (croppedBlob) return await blobToBase64(croppedBlob);
      const empPhoto = document.getElementById('empPhoto');
      if (empPhoto && empPhoto.files && empPhoto.files[0]) {
        return await blobToBase64(empPhoto.files[0]);
      }
      return null;
    }

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', () => {
      initCropper();

      document.getElementById('employeeForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const id = document.getElementById('employeeId').value;
        let photoUrl = '';

        const base64 = await getPhotoBase64();
        if (base64) {
          const uploadRes = await fetch(`${API}/upload`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: base64 })
          });
          const uploadData = await uploadRes.json();
          photoUrl = uploadData.photoUrl;
          croppedBlob = null;
        }

        // Handle Visa document upload
        let visaDocUrl = document.getElementById('existingVisaDoc').value || '';
        const visaDocFile = document.getElementById('empVisaDoc');
        if (visaDocFile && visaDocFile.files && visaDocFile.files[0]) {
          const file = visaDocFile.files[0];
          if (file.size > 5 * 1024 * 1024) {
            alert('⚠️ Visa document too large. Max 5MB.');
            return;
          }
          visaDocUrl = await new Promise((resolve, reject) => {
            const r = new FileReader();
            r.onload = () => resolve(r.result);
            r.onerror = () => reject(new Error('Failed to read file'));
            r.readAsDataURL(file);
          });
        }

        const employeeData = {
          employeeId: document.getElementById('empEmployeeId').value,
          name: document.getElementById('empName').value,
          role: document.getElementById('empRole').value,
          email: document.getElementById('empEmail').value,
          phone: document.getElementById('empPhone').value,
          department: document.getElementById('empDepartment').value,
          joinDate: document.getElementById('empJoinDate').value,
          leaveDays: parseInt(document.getElementById('empLeaveDays').value) || 0,
          leaveGrantedDate: document.getElementById('empLeaveGrantedDate').value || null,
          extendLeaveUntil: document.getElementById('empExtendLeaveUntil').value || null,
          visaDate: document.getElementById('empVisaDate').value || null,
          visaDoc: visaDocUrl,
          customFields: getCustomFields(),
        };

        if (photoUrl) {
          employeeData.photo = photoUrl;
        } else if (currentEmployee && currentEmployee.photo) {
          employeeData.photo = currentEmployee.photo;
        }

        await fetch(`${API}/employees/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(employeeData)
        });

        closeModal();
        await loadEmployee();
      });

      if (empId) loadEmployee();
    });

    function toggleVisaDoc() {
      const dropdown = document.getElementById('visaDropdown');
      const arrow = document.getElementById('visaArrow');
      if (!dropdown) return;
      if (dropdown.style.display === 'none' || dropdown.style.display === '') {
        dropdown.style.display = 'block';
        arrow.style.transform = 'rotate(180deg)';
      } else {
        dropdown.style.display = 'none';
        arrow.style.transform = 'rotate(0deg)';
      }
    }

    function openVisaDoc(src, type) {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:999; display:flex; align-items:center; justify-content:center;';
      overlay.onclick = () => document.body.removeChild(overlay);
      if (type === 'image') {
        const img = document.createElement('img');
        img.src = src;
        img.style.cssText = 'max-width:90%; max-height:90vh; border-radius:10px; object-fit:contain;';
        overlay.appendChild(img);
      } else {
        const iframe = document.createElement('iframe');
        iframe.src = src;
        iframe.style.cssText = 'width:90vw; height:90vh; border:none; border-radius:10px;';
        overlay.appendChild(iframe);
      }
      document.body.appendChild(overlay);
    }

    // ===== DELETE =====
    async function deleteEmployee() {
      if (!confirm('Are you sure you want to delete this employee?')) return;
      await fetch(`${API}/employees/${currentEmployee.id}`, { method: 'DELETE' });
      window.location.href = 'employees.html';  
    }
  </script>
  <script>
    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark-theme');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('themeBtn').textContent = isDark ? '☀️ Light' : '🌙 Dark';
    }
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        document.body.classList.add('dark-theme');
        document.addEventListener('DOMContentLoaded', () => {
          const btn = document.getElementById('themeBtn');
          if (btn) btn.textContent = '☀️ Light';
        });
      }
    })();
  </script>
</body>
