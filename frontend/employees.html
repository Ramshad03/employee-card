<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employees</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css"/>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-brand">🏢 Employee Card System</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="employees.html" class="active">Employees</a></li>
    </ul>
  </nav>

  <!-- Page Header -->
  <div class="page-header">
    <h2>Employee Directory</h2>
    <div class="header-actions">
      <input type="text" id="searchInput" placeholder="Search employees..." />
      <button class="btn-primary" onclick="openAddModal()">+ Add Employee</button>
      <button class="btn-secondary" onclick="exportCSV()">📥 Export CSV</button>
    </div>
  </div>

  <!-- Employee Cards Grid -->
  <div class="employee-grid" id="employeeGrid"></div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitle">Add Employee</h3>
      <form id="employeeForm">
        <input type="hidden" id="employeeId" />

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="empName" placeholder="Enter full name" required />
        </div>

        <div class="form-group">
          <label>Role</label>
          <input type="text" id="empRole" placeholder="Enter role" required />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="empEmail" placeholder="Enter email" required />
        </div>

        <div class="form-group">
          <label>Phone</label>
          <input type="text" id="empPhone" placeholder="Enter phone number" />
        </div>

        <div class="form-group">
          <label>Department</label>
          <input type="text" id="empDepartment" placeholder="Enter department" />
        </div>

        <div class="form-group">
          <label>Photo</label>
          <input type="file" id="empPhoto" accept="image/*" />
          <div id="cropContainer" style="display:none; margin-top:10px;">
            <img id="cropImage" style="max-width:100%; display:block;" />
            <button type="button" class="btn-primary" id="cropBtn" style="margin-top:10px;">✂️ Crop & Use Photo</button>
          </div>
          <canvas id="croppedCanvas" style="display:none;"></canvas>
          <img id="croppedPreview" style="display:none; width:90px; height:90px; border-radius:50%; object-fit:cover; border:3px solid #e94560; margin-top:10px;" />
        </div>

        <!-- Custom Fields Section -->
        <div class="custom-fields-section">
          <div class="custom-fields-header">
            <label>Additional Fields</label>
            <button type="button" class="btn-add-field" onclick="addCustomField()">+ Add Field</button>
          </div>
          <div id="customFieldsContainer"></div>
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn-primary" id="saveBtn">Save</button>
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2026 Employee Card System. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
