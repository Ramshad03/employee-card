<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employees</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">🏢 Employee Card System</div>
    <ul class="nav-links">
  <li class="nav-tab-group">
    <a href="employees.html" class="active">Employees</a>
    <span class="nav-separator">|</span>
    <a href="vehicles.html">Vehicle</a>
  </li>
</ul>
  </nav>

  <div class="page-header">
    <h2>Employee Directory</h2>
    <div class="header-actions">
      <input type="text" id="searchInput" placeholder="Search employees..." />
      <button class="btn-primary" onclick="openAddModal()">+ Add Employee</button>
      <button class="btn-secondary" onclick="exportCSV()">📥 Export CSV</button>
    </div>
  </div>

  <div class="employee-grid" id="employeeGrid"></div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitle">Add Employee</h3>
      <form id="employeeForm">
        <input type="hidden" id="employeeId" />

        <div class="form-group">
          <label>Employee ID</label>
          <input type="text" id="empEmployeeId" placeholder="Enter employee ID (e.g. T1)" required />
        </div>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="empName" placeholder="Enter full name" required />
        </div>
        <div class="form-group">
          <label>Role</label>
          <input type="text" id="empRole" placeholder="Enter role" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="empEmail" placeholder="Enter email" />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" id="empPhone" placeholder="Enter phone number" />
        </div>
        <div class="form-group">
          <label>Department</label>
          <input type="text" id="empDepartment" placeholder="Enter department" />
        </div>
        <div class="form-group">
          <label>Join Date</label>
          <input type="date" id="empJoinDate" />
        </div>
        <div class="form-group">
          <label>Annual Leave Days</label>
          <input type="number" id="empLeaveDays" placeholder="e.g. 60" min="1" required />
        </div>
        <div class="form-group">
          <label>Grant Leave From</label>
          <input type="date" id="empLeaveGrantedDate" />
        </div>
        <div class="form-group">
          <label>Extend Leave Until</label>
          <input type="date" id="empExtendLeaveUntil" />
        </div>
        <div class="form-group">
          <label>Photo</label>
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <input type="file" id="empPhoto" accept="image/*" />
            <input type="file" id="empCamera" accept="image/*" capture="environment" style="display:none;" />
            <button type="button" class="btn-secondary" onclick="openWebcam()">📷 Camera</button>
          </div>
          <div id="cropContainer" style="display:none; margin-top:10px;">
            <img id="cropImage" style="max-width:100%; display:block;" />
            <button type="button" class="btn-primary" id="cropBtn" style="margin-top:10px;">✂️ Crop & Use Photo</button>
          </div>
          <canvas id="croppedCanvas" style="display:none;"></canvas>
          <img id="croppedPreview" style="display:none; width:90px; height:90px; border-radius:50%; object-fit:cover; border:3px solid #e94560; margin-top:10px;" />
        </div>

        <div id="customFieldsContainer"></div>

        <div class="modal-actions">
          <button type="button" class="btn-add-field" onclick="addCustomField()">+ Add Field</button>
          <button type="submit" class="btn-primary" id="saveBtn">Save</button>
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Webcam Modal -->
  <div id="webcamModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:300; justify-content:center; align-items:center;">
    <div style="background:#fff; border-radius:14px; padding:24px; width:420px; max-width:95%; text-align:center;">
      <h3 style="margin-bottom:16px; color:#1a1a2e;">Take Photo</h3>
      <video id="webcamVideo" autoplay playsinline style="width:100%; border-radius:8px; margin-bottom:12px;"></video>
      <canvas id="webcamCanvas" style="display:none;"></canvas>
      <div style="display:flex; gap:10px; justify-content:center; margin-top:8px;">
        <button type="button" class="btn-primary" id="webcamCaptureBtn">📸 Capture</button>
        <button type="button" class="btn-secondary" id="webcamCloseBtn">✕ Close</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 Employee Card System. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
