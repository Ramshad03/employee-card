<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employees</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">🏢 Carbon (logo) </div>
    <ul class="nav-links">
      <li class="nav-tab-group">
        <a href="employees.html" class="active">Employees</a>
        <span class="nav-separator">|</span>
        <a href="vehicles.html">Vehicle</a>
      </li>
      <li class="nav-btn-group">
        <div id="notifWrapper">
          <button class="notif-btn" onclick="toggleNotifPanel()" title="Notifications">
            🔔
            <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
          </button>
          <div class="notif-panel" id="notifPanel">
            <div class="notif-header">Notifications</div>
            <div class="notif-list" id="notifList">
              <div class="notif-empty">Loading...</div>
            </div>
          </div>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
      </li>
    </ul>
  </nav>

  <div class="page-header">
    <h2>Employee Directory</h2>
    <div class="header-actions">
      <div class="search-filter-wrap">
        <input type="text" id="searchInput" placeholder="Search employees..." />
        <button type="button" class="search-filter-btn" id="employeeFilterToggle" title="Filter employees">Filter</button>
        <div class="search-filter-menu" id="employeeFilterMenu">
          <button type="button" class="active" data-filter="all"><span class="filter-dot all"></span>All employees</button>
          <button type="button" data-filter="active"><span class="filter-dot green"></span>Active</button>
          <button type="button" data-filter="visa-expired"><span class="filter-dot red"></span>Visa Expired</button>
          <button type="button" data-filter="visa-expiring"><span class="filter-dot orange"></span>Visa Expiring</button>
          <button type="button" data-filter="visa-due"><span class="filter-dot yellow"></span>Visa Due Soon</button>
          <button type="button" data-filter="on-leave"><span class="filter-dot grey"></span>On Leave</button>
        </div>
      </div>
      <button class="btn-primary btn-primary-glass" onclick="openAddModal()">+ Add Employee</button>
      <button class="btn-secondary glass-btn" onclick="exportCSV()">📥 Export CSV</button>
    </div>
  </div>

  <div class="employee-grid" id="employeeGrid"></div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitle">Add Employee</h3>
      <form id="employeeForm">
        <input type="hidden" id="employeeId" />

        <div class="form-group">
          <label>Employee ID</label>
          <input type="text" id="empEmployeeId" placeholder="Enter employee ID (e.g. T1)" required />
        </div>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="empName" placeholder="Enter full name" required />
        </div>
        <div class="form-group">
          <label>Department</label>
          <input type="text" id="empDepartment" placeholder="Enter Department" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="empEmail" placeholder="Enter email" />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" id="empPhone" placeholder="Enter phone number" />
        </div>
        <div class="form-group">
          <label>Role</label>
          <input type="text" id="empRole" placeholder="Enter role" />
        </div>
        <div class="form-group">
          <label>Join Date</label>
          <input type="date" id="empJoinDate" />
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select id="empGender">
            <option value="">Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="form-group">
          <label>Family Status</label>
          <select id="empMaritalStatus" onchange="toggleFamilyDoc(this.value)">
            <option value="">Select</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>
        <div class="form-group" id="familyDocGroup" style="display:none;">
          <label>Family Document (PDF/Image)</label>
          <input type="file" id="empFamilyDoc" accept="image/*,.pdf" />
        </div>
        <input type="hidden" id="existingFamilyDoc" />
        <div class="form-group">
          <label>Annual Leave Days</label>
          <input type="number" id="empLeaveDays" placeholder="e.g. 60" min="1" required />
        </div>
        <div class="form-group">
          <label>Grant Leave From</label>
          <input type="date" id="empLeaveGrantedDate" />
        </div>
        <div class="form-group">
          <label>Extend Leave Until</label>
          <input type="date" id="empExtendLeaveUntil" />
        </div>
        <div class="form-group">
          <label>Photo</label>
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <input type="file" id="empPhoto" accept="image/*" />
            <input type="file" id="empCamera" accept="image/*" capture="environment" style="display:none;" />
            <button type="button" class="btn-secondary" onclick="openWebcam()">📷 Camera</button>
          </div>
          <div id="cropContainer" style="display:none; margin-top:10px;">
            <img id="cropImage" style="max-width:100%; display:block;" />
            <button type="button" class="btn-primary" id="cropBtn" style="margin-top:10px;">✂️ Crop & Use Photo</button>
          </div>
          <canvas id="croppedCanvas" style="display:none;"></canvas>
          <img id="croppedPreview" style="display:none; width:90px; height:90px; border-radius:50%; object-fit:cover; border:3px solid #e94560; margin-top:10px;" />
        </div>

        <div id="customFieldsContainer"></div>

        <div class="modal-actions">
          <button type="button" class="btn-add-field" onclick="addCustomField()">+ Add Field</button>
          <button type="submit" class="btn-primary" id="saveBtn">Save</button>
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Webcam Modal -->
  <div id="webcamModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:300; justify-content:center; align-items:center;">
    <div style="background:#fff; border-radius:14px; padding:24px; width:420px; max-width:95%; text-align:center;">
      <h3 style="margin-bottom:16px; color:#1a1a2e;">Take Photo</h3>
      <video id="webcamVideo" autoplay playsinline style="width:100%; border-radius:8px; margin-bottom:12px;"></video>
      <canvas id="webcamCanvas" style="display:none;"></canvas>
      <div style="display:flex; gap:10px; justify-content:center; margin-top:8px;">
        <button type="button" class="btn-primary" id="webcamCaptureBtn">📸 Capture</button>
        <button type="button" class="btn-secondary" id="webcamCloseBtn">✕ Close</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 Carbon . All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>
  <script src="app.js"></script>
  <script src="notifications.js"></script>
  <script>
    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark-theme');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('themeBtn').textContent = isDark ? '☀️ Light' : '🌙 Dark';
    }
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        document.body.classList.add('dark-theme');
        document.addEventListener('DOMContentLoaded', () => {
          const btn = document.getElementById('themeBtn');
          if (btn) btn.textContent = '☀️ Light';
        });
      }
    })();
  </script>
</body>
</html>
