<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vehicle Details</title>
  <link rel="stylesheet" href="style.css" />
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  .detail-container { flex: 1; }
  .footer { margin-top: auto; }
</style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">🏢 Employee Card System</div>
    <ul class="nav-links">
      <li class="nav-tab-group">
        <a href="employees.html">Employees</a>
        <span class="nav-separator">|</span>
        <a href="vehicles.html" class="active">Vehicle</a>
      </li>
    </ul>
  </nav>

  <div class="detail-container" id="vehicleDetail">
    <p style="text-align:center; color:#888;">Loading...</p>
  </div>

  <footer class="footer">
    <p>© 2026 Employee Card System. All rights reserved.</p>
  </footer>

  <script>
    const VAPI = 'http://localhost:3000/api/vehicles';

    async function loadVehicleDetail() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) { window.location.href = 'vehicles.html'; return; }

      const res = await fetch(`${VAPI}/${id}`);
      const v = await res.json();

      const statusColor = getStatusColor(v.status);

      const photoHTML = v.photo
        ? `<img src="${v.photo}" alt="${v.name}" style="width:180px; height:120px; object-fit:cover; border-radius:12px; border:3px solid ${statusColor}; display:block;" />`
        : `<div style="width:180px; height:120px; border-radius:12px; background:${statusColor}; display:flex; align-items:center; justify-content:center; font-size:52px;">🚗</div>`;  

      const customFieldsHTML = (v.customFields || []).map(f => `
        <div class="detail-row">
          <span class="detail-label">${f.label}</span>
          <span class="detail-value">${f.value}</span>
        </div>`).join('');

      document.getElementById('vehicleDetail').innerHTML = `
        <div class="detail-card">
          <div class="detail-header" style="display:flex; align-items:flex-start; gap:24px; margin-bottom:24px;">
            <div style="flex-shrink:0;">${photoHTML}</div>
            <div class="detail-title" style="display:flex; flex-direction:column; justify-content:center;">
              <h2 style="margin:0 0 6px 0;">${v.vehicleId || ''}</h2>
              <h3 style="margin:0 0 6px 0;">${v.name || ''}</h3>
              <p style="color:${statusColor}; font-weight:600; margin:0;">● ${v.status || 'Active'}</p>
            </div>
          </div>

          <div class="detail-body">
            <div class="detail-row">
              <span class="detail-label">License Plate</span>
              <span class="detail-value">${v.plate || '—'}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Type</span>
              <span class="detail-value">${v.type || '—'}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Assigned Driver</span>
              <span class="detail-value">${v.driver || '—'}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Registration Date</span>
              <span class="detail-value">${v.regDate ? new Date(v.regDate).toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'}) : '—'}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Insurance Expiry</span>
              <span class="detail-value">${v.insuranceExpiry ? new Date(v.insuranceExpiry).toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'}) : '—'}</span>
            </div>
            ${customFieldsHTML}
          </div>

          <div style="display:flex; gap:12px; margin-top:28px;">
            <button class="btn-primary" onclick="window.location.href='vehicles.html?edit=${v.id}'">✏️ Edit</button>
            <button class="btn-delete" onclick="deleteVehicle('${v.id}')">🗑️ Delete</button>
          </div>
        </div>
      `;
    }

    function getStatusColor(status) {
      switch (status) {
        case 'Active': return '#27ae60';
        case 'In Service': return '#2980b9';
        case 'Under Maintenance': return '#e67e22';
        case 'Inactive': return '#e94560';
        default: return '#27ae60';
      }
    }

    async function deleteVehicle(id) {
      if (!confirm('Delete this vehicle?')) return;
      await fetch(`${VAPI}/${id}`, { method: 'DELETE' });
      window.location.href = 'vehicles.html';
    }

    loadVehicleDetail();
  </script>
</body>
</html>
